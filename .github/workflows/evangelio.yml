name: Evangelio del día

# Actualiza evangelio.json cada madrugada para que la web muestre
# la lectura del día sin que nadie tenga que tocar nada.
#
# El sitio es estático (GitHub Pages), así que "lo dinámico" se
# resuelve así: una tarea programada reescribe el JSON y lo commitea.

on:
  schedule:
    # 05:30 UTC = 01:30 en Venezuela. Ya está listo al amanecer.
    - cron: '30 5 * * *'
  workflow_dispatch:        # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: evangelio
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Descargar el Evangelio
        run: python tools/actualizar_evangelio.py

      - name: Guardar los cambios
        run: |
          if git diff --quiet -- evangelio.json; then
            echo "El Evangelio ya estaba al día. No hay nada que commitear."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evangelio.json
          git commit -m "Evangelio del día: $(date -u +%Y-%m-%d)"
          git push
